<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redmine ↔ Markdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #dadce0;
            position: sticky;
            top: 0;
        }
        .lang-btn {
            background: none;
            border: none;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 24px;
            cursor: default;
        }
        .swap-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            color: #5f6368;
            font-size: 20px;
        }
        .swap-btn:hover { color: #1a73e8; }
        .input-section {
            background: white;
            border-bottom: 1px solid #dadce0;
            position: relative;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            border: none;
            outline: none;
            font-size: 20px;
            padding: 20px;
            padding-right: 50px;
            font-family: inherit;
            resize: none;
            line-height: 1.5;
        }
        textarea::placeholder { color: #80868b; }
        .clear-btn {
            position: absolute;
            top: 20px;
            right: 16px;
            background: none;
            border: none;
            color: #5f6368;
            font-size: 24px;
            cursor: pointer;
            display: none;
            line-height: 1;
        }
        .clear-btn.show { display: block; }
        .clear-btn:hover { color: #202124; }
        .output-section {
            background: #f5f5f5;
            position: relative;
            min-height: 180px;
        }
        .output-section textarea {
            background: transparent;
        }
        .copy-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            color: #1a73e8;
            font-size: 14px;
        }
        .copy-btn:hover { background: #f8f9fa; }
        .copy-btn.copied {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        .help-toggle {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: white;
            border: none;
            border-top: 1px solid #dadce0;
            text-align: left;
            cursor: pointer;
            color: #1a73e8;
            font-size: 14px;
        }
        .help-content {
            display: none;
            background: white;
            padding: 0 20px 20px;
        }
        .help-content.show { display: block; }
        .help-content table {
            width: 100%;
            border-collapse: collapse;
        }
        .help-content th, .help-content td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        .help-content th { color: #5f6368; font-weight: 500; }
        .help-content td { font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <span class="lang-btn" id="from-label">Redmine</span>
        <button class="swap-btn" onclick="swap()" title="交換">⇄</button>
        <span class="lang-btn" id="to-label">Markdown</span>
    </div>

    <div class="input-section">
        <textarea id="input" placeholder="輸入文字" oninput="convert()"></textarea>
        <button class="clear-btn" id="clear-btn" onclick="clearAll()">×</button>
    </div>

    <div class="output-section">
        <textarea id="output" readonly placeholder="轉換結果"></textarea>
        <button class="copy-btn" onclick="copy()">複製</button>
    </div>

    <button class="help-toggle" onclick="toggleHelp()">格式對照 ▾</button>
    <div class="help-content" id="help">
        <table>
            <tr><th>Redmine</th><th>Markdown</th><th>說明</th></tr>
            <tr><td>h1. 標題</td><td># 標題</td><td>標題</td></tr>
            <tr><td>*粗體*</td><td>**粗體**</td><td>粗體</td></tr>
            <tr><td>_斜體_</td><td>*斜體*</td><td>斜體</td></tr>
            <tr><td>* 項目</td><td>- 項目</td><td>列表</td></tr>
            <tr><td># 項目</td><td>1. 項目</td><td>編號</td></tr>
            <tr><td>"文字":url</td><td>[文字](url)</td><td>連結</td></tr>
            <tr><td>@code@</td><td>`code`</td><td>程式碼</td></tr>
        </table>
    </div>

    <script>
        let dir = 'r2m';

        function swap() {
            dir = dir === 'r2m' ? 'm2r' : 'r2m';
            document.getElementById('from-label').textContent = dir === 'r2m' ? 'Redmine' : 'Markdown';
            document.getElementById('to-label').textContent = dir === 'r2m' ? 'Markdown' : 'Redmine';
            const inp = document.getElementById('input'), out = document.getElementById('output');
            [inp.value, out.value] = [out.value, inp.value];
            convert();
        }

        function convert() {
            const inp = document.getElementById('input');
            document.getElementById('clear-btn').classList.toggle('show', inp.value.length > 0);
            document.getElementById('output').value = dir === 'r2m' ? r2m(inp.value) : m2r(inp.value);
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('clear-btn').classList.remove('show');
        }

        function copy() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            const btn = document.querySelector('.copy-btn');
            btn.textContent = '已複製';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1500);
        }

        function toggleHelp() {
            document.getElementById('help').classList.toggle('show');
        }

        function r2m(t) {
            if (!t) return '';
            let r = t;
            const cb = [], ic = [];
            r = r.replace(/<pre><code[^>]*>([\s\S]*?)<\/code><\/pre>/g, (m,c) => { cb.push(c); return `__CB${cb.length-1}__`; });
            r = r.replace(/<pre>([\s\S]*?)<\/pre>/g, (m,c) => { cb.push(c); return `__CB${cb.length-1}__`; });
            r = r.replace(/@([^@\n]+)@/g, (m,c) => { ic.push(c); return `__IC${ic.length-1}__`; });
            r = r.replace(/^(#+)\s+(.+)$/gm, (m,h,c) => `__OL__${'  '.repeat(h.length-1)}1. ${c}`);
            r = r.replace(/^h([1-6])\.\s*(.+)$/gm, (m,n,c) => '#'.repeat(n) + ' ' + c);
            r = r.replace(/__OL__/g, '');
            r = r.replace(/(?<!\S)\*([^\*\n]+)\*(?!\S)/g, '**$1**');
            r = r.replace(/(?<![a-zA-Z0-9])_([^_\n]+)_(?![a-zA-Z0-9])/g, '*$1*');
            r = r.replace(/(?<!\S)-([^\-\n]+)-(?!\S)/g, '~~$1~~');
            r = r.replace(/(?<!\S)\+([^\+\n]+)\+(?!\S)/g, '<u>$1</u>');
            r = r.replace(/"([^"]+)":(\S+)/g, '[$1]($2)');
            r = r.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '[$2]($1)');
            r = r.replace(/\[\[([^\]]+)\]\]/g, '[$1]($1)');
            r = r.replace(/!([^\s!]+)!/g, '![]($1)');
            r = r.replace(/^(\*+)\s+(.+)$/gm, (m,a,c) => '  '.repeat(a.length-1) + '- ' + c);
            r = r.replace(/^bq\.\s*(.+)$/gm, '> $1');
            r = r.replace(/((?:^\|.+\|\s*\n?)+)/gm, tb => {
                const ls = tb.trim().split('\n'), rs = [];
                for (const l of ls) {
                    if (l.includes('|_.')) {
                        const cv = l.replace(/\|_\./g, '|');
                        rs.push(cv);
                        rs.push('|' + '---|'.repeat((cv.match(/\|/g)||[]).length - 1));
                    } else rs.push(l);
                }
                return rs.join('\n');
            });
            cb.forEach((c,i) => { r = r.replace(`__CB${i}__`, '```\n'+c+'\n```'); });
            ic.forEach((c,i) => { r = r.replace(`__IC${i}__`, '`'+c+'`'); });
            return r;
        }

        function m2r(t) {
            if (!t) return '';
            let r = t;
            const cb = [], ic = [];
            r = r.replace(/```(\w*)\n([\s\S]*?)```/g, (m,l,c) => { cb.push({l,c}); return `__CB${cb.length-1}__`; });
            r = r.replace(/`([^`\n]+)`/g, (m,c) => { ic.push(c); return `__IC${ic.length-1}__`; });
            r = r.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '!$2!');
            r = r.replace(/^(#{1,6}) (.+)$/gm, (m,h,c) => `h${h.length}. ${c}`);
            r = r.replace(/\*\*([^\*]+)\*\*/g, '__B__$1__EB__');
            r = r.replace(/(?<!\*)\*([^\*]+)\*(?!\*)/g, '_$1_');
            r = r.replace(/__B__(.+?)__EB__/g, '*$1*');
            r = r.replace(/~~([^~]+)~~/g, '-$1-');
            r = r.replace(/<u>([^<]+)<\/u>/g, '+$1+');
            r = r.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '"$1":$2');
            r = r.replace(/^(\s*)[-\*]\s+(.+)$/gm, (m,i,c) => '*'.repeat(Math.floor(i.length/2)+1) + ' ' + c);
            r = r.replace(/^(\s*)\d+\.\s+(.+)$/gm, (m,i,c) => '#'.repeat(Math.floor(i.length/2)+1) + ' ' + c);
            r = r.replace(/^>\s*(.+)$/gm, 'bq. $1');
            r = r.replace(/((?:^\|.+\|\s*\n?)+)/gm, tb => {
                const ls = tb.trim().split('\n'), rs = [];
                let first = true;
                for (const l of ls) {
                    if (/^\|[\s\-:|]+\|$/.test(l)) continue;
                    if (first) { rs.push(l.replace(/\|([^|]+)/g, '|_.$1')); first = false; }
                    else rs.push(l);
                }
                return rs.join('\n');
            });
            cb.forEach(({l,c},i) => { r = r.replace(`__CB${i}__`, `<pre><code class="${l}">\n${c}</code></pre>`); });
            ic.forEach((c,i) => { r = r.replace(`__IC${i}__`, `@${c}@`); });
            return r;
        }
    </script>
</body>
</html>
