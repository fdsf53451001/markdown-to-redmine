<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redmine ↔ Markdown</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid #dadce0;
            position: sticky;
            top: 0;
        }
        .lang-btn {
            background: none;
            border: none;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 24px;
            cursor: default;
        }
        .swap-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            color: #5f6368;
            font-size: 20px;
        }
        .swap-btn:hover { color: #1a73e8; }
        .input-section {
            background: white;
            border-bottom: 1px solid #dadce0;
            position: relative;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            border: none;
            outline: none;
            font-size: 20px;
            padding: 20px;
            padding-right: 50px;
            font-family: inherit;
            resize: none;
            line-height: 1.5;
        }
        textarea::placeholder { color: #80868b; }
        .clear-btn {
            position: absolute;
            top: 20px;
            right: 16px;
            background: none;
            border: none;
            color: #5f6368;
            font-size: 24px;
            cursor: pointer;
            display: none;
            line-height: 1;
        }
        .clear-btn.show { display: block; }
        .clear-btn:hover { color: #202124; }
        .output-section {
            background: #f5f5f5;
            position: relative;
            min-height: 180px;
        }
        .output-section textarea {
            background: transparent;
        }
        .copy-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            color: #1a73e8;
            font-size: 14px;
        }
        .copy-btn:hover { background: #f8f9fa; }
        .copy-btn.copied {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        .help-toggle {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: white;
            border: none;
            border-top: 1px solid #dadce0;
            text-align: left;
            cursor: pointer;
            color: #1a73e8;
            font-size: 14px;
        }
        .help-content {
            display: none;
            background: white;
            padding: 0 20px 20px;
        }
        .help-content.show { display: block; }
        .help-content table {
            width: 100%;
            border-collapse: collapse;
        }
        .help-content th, .help-content td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        .help-content th { color: #5f6368; font-weight: 500; }
        .help-content td { font-family: monospace; }
    </style>
</head>
<body>
    <div class="header">
        <span class="lang-btn" id="from-label">Markdown</span>
        <button class="swap-btn" onclick="swap()" title="交換">⇄</button>
        <span class="lang-btn" id="to-label">Redmine</span>
    </div>

    <div class="input-section">
        <textarea id="input" placeholder="輸入文字" oninput="convert()"></textarea>
        <button class="clear-btn" id="clear-btn" onclick="clearAll()">×</button>
    </div>

    <div class="output-section">
        <textarea id="output" readonly placeholder="轉換結果"></textarea>
        <button class="copy-btn" onclick="copy()">複製</button>
    </div>

    <button class="help-toggle" onclick="toggleHelp()">格式對照 ▾</button>
    <div class="help-content" id="help">
        <table>
            <tr><th>Redmine</th><th>Markdown</th><th>說明</th></tr>
            <tr><td>h2. 標題</td><td># 標題</td><td>標題</td></tr>
            <tr><td>*粗體*</td><td>**粗體**</td><td>粗體</td></tr>
            <tr><td>_斜體_</td><td>*斜體*</td><td>斜體</td></tr>
            <tr><td>+底線+</td><td>&lt;u&gt;底線&lt;/u&gt;</td><td>底線</td></tr>
            <tr><td>-刪除線-</td><td>~~刪除線~~</td><td>刪除線</td></tr>
            <tr><td>* 項目</td><td>- 項目</td><td>無序列表</td></tr>
            <tr><td># 項目</td><td>1. 項目</td><td>有序列表</td></tr>
            <tr><td>"文字":url</td><td>[文字](url)</td><td>連結</td></tr>
            <tr><td>!image.png!</td><td>![](image.png)</td><td>圖片</td></tr>
            <tr><td>@code@</td><td>`code`</td><td>行內程式碼</td></tr>
            <tr><td>bq. 引言</td><td>> 引言</td><td>引用</td></tr>
            <tr><td>---</td><td>---</td><td>水平線</td></tr>
        </table>
    </div>

    <script>
        let dir = 'm2r';  // 預設 Markdown → Redmine

        function swap() {
            dir = dir === 'm2r' ? 'r2m' : 'm2r';
            document.getElementById('from-label').textContent = dir === 'm2r' ? 'Markdown' : 'Redmine';
            document.getElementById('to-label').textContent = dir === 'm2r' ? 'Redmine' : 'Markdown';
            const inp = document.getElementById('input'), out = document.getElementById('output');
            [inp.value, out.value] = [out.value, inp.value];
            convert();
        }

        function convert() {
            const inp = document.getElementById('input');
            document.getElementById('clear-btn').classList.toggle('show', inp.value.length > 0);
            document.getElementById('output').value = dir === 'm2r' ? m2r(inp.value) : r2m(inp.value);
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('clear-btn').classList.remove('show');
        }

        function copy() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            const btn = document.querySelector('.copy-btn');
            btn.textContent = '已複製';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1500);
        }

        function toggleHelp() {
            document.getElementById('help').classList.toggle('show');
        }

        // Redmine → Markdown
        function r2m(t) {
            if (!t) return '';
            let r = t;

            // 保護程式碼區塊
            const cb = [], ic = [];
            r = r.replace(/<pre><code[^>]*>([\s\S]*?)<\/code><\/pre>/g, (m,c) => { cb.push(c); return `__CB${cb.length-1}__`; });
            r = r.replace(/<pre>([\s\S]*?)<\/pre>/g, (m,c) => { cb.push(c); return `__CB${cb.length-1}__`; });
            r = r.replace(/@([^@\n]+)@/g, (m,c) => { ic.push(c); return `__IC${ic.length-1}__`; });

            // 有序列表 (# item) - 先處理避免與標題衝突
            r = r.replace(/^(#+) +(.+)$/gm, (m,h,c) => `__OL__${'  '.repeat(h.length-1)}1. ${c}`);

            // 標題 h2. → #, h3. → ## (往上移一級，與m2r對應)
            r = r.replace(/^h([1-6])\.\s*(.+)$/gm, (m,n,c) => {
                const level = Math.max(parseInt(n) - 1, 1);  // 往上移一級，最小1個#
                return '#'.repeat(level) + ' ' + c;
            });

            // 移除有序列表標記
            r = r.replace(/__OL__/g, '');

            // 粗斜體 _*text*_ → ***text***
            r = r.replace(/_\*([^*]+)\*_/g, '***$1***');

            // 粗體 *text* → **text** (不在行首，避免與列表衝突)
            r = r.replace(/(\s|^)\*(\S[^*]*\S|\S)\*(?=\s|$|[.,;:!?])/gm, '$1**$2**');

            // 斜體 _text_ → *text*
            r = r.replace(/(\s|^)_(\S[^_]*\S|\S)_(?=\s|$|[.,;:!?])/gm, '$1*$2*');

            // 底線 +text+ → <u>text</u>
            r = r.replace(/(\s|^)\+(\S[^+]*\S|\S)\+(?=\s|$|[.,;:!?])/gm, '$1<u>$2</u>');

            // 刪除線 -text- → ~~text~~
            r = r.replace(/(\s|^)-(\S[^-]*\S|\S)-(?=\s|$|[.,;:!?])/gm, '$1~~$2~~');

            // 連結 "text":url → [text](url)
            r = r.replace(/"([^"]+)":(\S+)/g, '[$1]($2)');

            // Wiki 連結
            r = r.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '[$2]($1)');
            r = r.replace(/\[\[([^\]]+)\]\]/g, '[$1]($1)');

            // 圖片 !image! → ![](image)
            r = r.replace(/!>?([^\s!]+)!/g, '![]($1)');

            // 無序列表 * item → - item
            r = r.replace(/^(\*+) +(.+)$/gm, (m,a,c) => '  '.repeat(a.length-1) + '- ' + c);

            // 區塊引言 bq. text → > text
            r = r.replace(/^bq\.\s*(.+)$/gm, '> $1');

            // 段落對齊 (移除，Markdown 不支援)
            r = r.replace(/^p[>=]\.\s*/gm, '');

            // 表格
            r = r.replace(/((?:^\|.+\|\s*\n?)+)/gm, tb => {
                const ls = tb.trim().split('\n'), rs = [];
                for (const l of ls) {
                    if (l.includes('|_.')) {
                        const cv = l.replace(/\|_\.\s*/g, '| ');
                        rs.push(cv);
                        const cols = (cv.match(/\|/g)||[]).length - 1;
                        rs.push('|' + ' --- |'.repeat(cols));
                    } else {
                        rs.push(l);
                    }
                }
                return rs.join('\n');
            });

            // 還原程式碼
            cb.forEach((c,i) => { r = r.replace(`__CB${i}__`, '```\n'+c+'\n```'); });
            ic.forEach((c,i) => { r = r.replace(`__IC${i}__`, '`'+c+'`'); });

            return r;
        }

        // Markdown → Redmine
        function m2r(t) {
            if (!t) return '';
            let r = t;

            // 保護程式碼區塊
            const cb = [], ic = [];
            r = r.replace(/```(\w*)\n([\s\S]*?)```/g, (m,l,c) => { cb.push({l,c}); return `__CB${cb.length-1}__`; });
            r = r.replace(/`([^`\n]+)`/g, (m,c) => { ic.push(c); return `__IC${ic.length-1}__`; });

            // 保護水平線
            r = r.replace(/^-{3,}$/gm, '__HR__');
            r = r.replace(/^\*{3,}$/gm, '__HR__');

            // 表格轉換
            const lines = r.split('\n');
            const newLines = [];
            let tableStarted = false;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trim();
                if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
                    if (/^[\|\-\s:]+$/.test(trimmed)) continue;
                    if (!tableStarted) {
                        tableStarted = true;
                        const parts = trimmed.split('|').filter(p => p !== '');
                        newLines.push('|_. ' + parts.map(p => p.trim()).join(' |_. ') + ' |');
                    } else {
                        newLines.push(line);
                    }
                } else {
                    tableStarted = false;
                    newLines.push(line);
                }
            }
            r = newLines.join('\n');

            // 圖片
            r = r.replace(/!\[([^\]]*)\]\(([^\)]+)\)/g, '!$2!');

            // 標題 # → h2., ## → h3.
            r = r.replace(/^(#{1,6}) +(.+)$/gm, (m,h,c) => {
                const level = Math.min(h.length + 1, 6);
                return `h${level}. ${c}`;
            });

            // 無序列表 - 必須在 bold/italic 之前！
            r = r.replace(/^(\s*)[-*] +(.+)$/gm, (m,indent,content) => {
                const level = Math.floor(indent.length / 2) + 1;
                return '__UL__' + '*'.repeat(level) + ' ' + content;
            });

            // 有序列表
            r = r.replace(/^(\s*)\d+\. +(.+)$/gm, (m,indent,content) => {
                const level = Math.floor(indent.length / 2) + 1;
                return '#'.repeat(level) + ' ' + content;
            });

            // 粗斜體
            r = r.replace(/\*\*\*([^*\n]+)\*\*\*/g, '_*$1*_');
            // 粗體
            r = r.replace(/\*\*([^*\n]+)\*\*/g, '*$1*');
            // 斜體
            r = r.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '_$1_');

            // 還原無序列表
            r = r.replace(/__UL__/g, '');

            // 刪除線
            r = r.replace(/~~([^~\n]+)~~/g, '-$1-');
            // 底線
            r = r.replace(/<u>([^<]+)<\/u>/g, '+$1+');
            // 連結
            r = r.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '"$1":$2');
            // 引用
            r = r.replace(/^> +(.+)$/gm, 'bq. $1');

            // 還原水平線
            r = r.replace(/__HR__/g, '---');

            // 還原程式碼
            cb.forEach(({l,c},i) => {
                const lang = l ? ` class="${l}"` : '';
                r = r.replace(`__CB${i}__`, () => `<pre><code${lang}>\n${c}</code></pre>`);
            });
            ic.forEach((c,i) => { r = r.replace(`__IC${i}__`, () => `@${c}@`); });

            // 最後處理：確保標題後有空行，移除多餘空行
            const finalLines = r.split('\n');
            const result = [];
            for (let i = 0; i < finalLines.length; i++) {
                const line = finalLines[i];
                result.push(line);
                // 如果是標題，確保下一行是空行
                if (/^h[1-6]\. /.test(line)) {
                    if (i + 1 < finalLines.length && finalLines[i + 1].trim() !== '') {
                        result.push('');
                    }
                }
            }
            r = result.join('\n');
            r = r.replace(/\n{3,}/g, '\n\n');

            return r;
        }
    </script>
</body>
</html>
